<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>copy-spotter results</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #222;
            background: #fff;
        }

        main {
            padding: 20px;
        }

        [hidden] {
            display: none !important;
        }

        .meta, .count {
            color: #666;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin: 16px 0;
        }

        .filters label {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .filters input {
            font: inherit;
            padding: 4px 6px;
        }

        #min-score {
            width: 6em;
        }

        .table-wrap {
            overflow: auto;
            margin-bottom: 32px;
        }

        #pairs-wrap {
            max-height: 60vh;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background: #f5f5f5;
        }

        thead th {
            position: sticky;
            top: 0;
        }

        th.name, td.name {
            text-align: left;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td.self {
            color: #bbb;
            text-align: center;
        }

        td.dim a {
            opacity: 0.25;
        }

        a {
            color: #06c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        a.level-0 {
            color: green;
        }

        a.level-1, span.level-1 {
            color: #b38f00;
        }

        a.level-2, span.level-2 {
            color: #cc5200;
        }

        a.level-3, span.level-3 {
            color: #990033;
            font-weight: bold;
        }

        span.level-0 {
            color: green;
        }

        #comparison header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 16px;
            padding: 12px 20px 0;
        }

        #comparison .score {
            font-weight: bold;
        }

        .container {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 20px 20px;
        }

        .content {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            padding: 10px;
            overflow: auto;
            height: 85vh;
            line-height: 1.5;
        }

        h3 {
            margin-top: 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .match {
            font-weight: bold;
            cursor: pointer;
        }

        #more-pairs {
            font: inherit;
            padding: 4px 10px;
            margin: -24px 0 32px;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }

            .content {
                height: auto;
            }
        }
    </style>
</head>
<body>
<main id="overview">
    <h1>copy-spotter results</h1>
    <p class="meta" id="meta"></p>

    <div class="filters">
        <label>Minimum score (%) <input type="number" id="min-score" min="0" max="100" step="any" value="0"></label>
        <label>Document name <input type="search" id="name-filter" placeholder="part of a name"></label>
        <span class="count" id="pair-count"></span>
    </div>

    <h2>Most similar pairs</h2>
    <div class="table-wrap" id="pairs-wrap">
        <table>
            <thead><tr id="pairs-head"></tr></thead>
            <tbody id="pairs"></tbody>
        </table>
    </div>
    <button type="button" id="more-pairs" hidden></button>

    <h2>Similarity matrix</h2>
    <p class="meta" id="matrix-legend"></p>
    <div class="table-wrap" id="matrix-wrap">
        <table id="matrix"></table>
    </div>
</main>

<section id="comparison" hidden>
    <header>
        <a href="#">&larr; All results</a>
        <span class="score" id="pair-score"></span>
        <span class="count" id="pair-blocks"></span>
    </header>
    <div class="container">
        <div class="content" id="left"></div>
        <div class="content" id="right"></div>
    </div>
</section>

16],[618,626],[627,635],[637,645],[646,654]]},{"name":"long.txt","text":"Academic integrity is the quiet agreement that holds a school together. Students trust that grades reflect real effort, and teachers trust that the work in front of them was written by the person who signed it.\n\nRivers carve their valleys slowly, one grain of sand at a time, until the landscape looks as if it had always been that way.\n\nCopying a few sentences from a classmate may look harmless, but a careful reader notices the change in voice at once. Good writing keeps one voice from the first line to the last, and every borrowed idea is given its source.\n\nDetection tools compare documents word by word and report the passages they share. A tool cannot judge intent, so a teacher must always read the highlighted passages before drawing a conclusion.\n\nRivers carve their valleys slowly, one grain of sand at a time.\n\nA short history of the library: the first catalogue was written by hand, the second was typed, and the third lives on a server in a basement that nobody visits. Librarians still remember the smell of the card drawers and the sound of the stamp on the return date.\n\nIn the end, the best defence against plagiarism is an assignment that asks for personal thinking, clear sources and honest drafts. Students who keep their drafts can always show how an idea grew, and teachers who read those drafts learn more than any score could tell them.","spans":[[0,8],[9,18],[19,21],[22,25],[26,31],[32,41],[42,46],[47,52],[53,54],[55,61],[62,70],[72,80],[81,86],[87,91],[92,98],[99,106],[107,111],[112,118],[120,123],[124,132],[133,138],[139,143],[144,147],[148,152],[153,155],[156,161],[162,164],[165,169],[170,173],[174,181],[182,184],[185,188],[189,195],[196,199],[200,206],[207,209],[212,218],[219,224],[225,230],[231,238],[239,245],[247,250],[251,256],[257,259],[260,264],[265,267],[268,269],[270,274],[276,281],[282,285],[286,295],[296,301],[302,304],[305,307],[308,310],[311,314],[315,321],[322, <script>
(function () {
    "use strict";

    // Shape documented in copy_spotter.single_page.report_data.
    const data = JSON.parse(document.getElementById("report-data").textContent);
    const docs = data.documents;
    const pairs = data.pairs;
    const ratioMode = data.score_mode === "ratio";

    function el(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
    }

    function level(score) {
        let n = 0;
        for (const t of data.thresholds) {
            if (score > t) n += 1;
        }
        return n;
    }

    function blockColor(k) {
        const hue = (k * 137.508) % 360;  // same golden-angle colors as the multi-page report
        return "hsl(" + Math.round(hue) + ", 75%, 35%)";
    }

    // Scores shown for (i found in j, j found in i): both are the ratio in ratio mode.
    function shown(p) {
        return ratioMode ? [p.ratio, p.ratio] : [p.coverage_i, p.coverage_j];
    }

    function best(p) {
        return Math.max.apply(null, shown(p));
    }

    function pairHash(p) {
        return "#pair-" + p.i + "-" + p.j;
    }

    function scoreLink(p, score) {
        const a = el("a", score + "", "level-" + level(score));
        a.href = pairHash(p);
        a.title = docs[p.i].name + " vs " + docs[p.j].name;
        return a;
    }

    function scoreSpan(score) {
        return el("span", score + "%", "level-" + level(score));
    }

    function nameCell(tag, name) {
        const cell = el(tag, name, "name");
        cell.title = name;
        return cell;
    }

    // Fill `target` with the document's original text, wrapping each [start, size, block] word range in a
    // colored span from its first word's first character to its last word's last character. Ranges may come
    // in any order; a range overlapping an earlier one is trimmed (same rules as report.highlight).
    function renderDoc(target, doc, ranges, side, other) {
        const text = el("div", undefined, "text");
        target.replaceChildren(el("h3", doc.name), text);
        ranges.sort(function (x, y) { return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; });
        let cursor = 0;
        let nextWord = 0;
        for (const [start, size, k] of ranges) {
            const first = Math.max(start, nextWord);
            const stop = start + size;
            if (first >= stop) continue;
            const begin = doc.spans[first][0];
            const end = doc.spans[stop - 1][1];
            nextWord = stop;
            text.appendChild(document.createTextNode(doc.text.slice(cursor, begin)));
            const span = el("span", doc.text.slice(begin, end), "match");
            span.style.color = blockColor(k);
            span.id = side + "-" + k;
            span.title = "Block " + (k + 1) + ", click to find it in the other document";
            span.addEventListener("click", function () {
                const twin = document.getElementById(other + "-" + k);
                if (twin) twin.scrollIntoView({block: "center"});
            });
            text.appendChild(span);
            cursor = end;
        }
        text.appendChild(document.createTextNode(doc.text.slice(cursor)));
    }

    function showComparison(p) {
        const left = docs[p.i];
        const right = docs[p.j];
        const scores = shown(p);
        const header = document.getElementById("pair-score");
        if (ratioMode) {
            header.replaceChildren("Similarity: ", scoreSpan(scores[0]));
        } else {
            header.replaceChildren(
                left.name + " found in " + right.name + ": ", scoreSpan(scores[0]),
                " \u00b7 " + right.name + " found in " + left.name + ": ", scoreSpan(scores[1])
            );
        }
        document.getElementById("pair-blocks").textContent = p.blocks.length + " matching blocks";
        renderDoc(document.getElementById("left"), left, p.blocks.map(function (b, k) { return [b[0], b[2], k]; }), "l", "r");
        renderDoc(document.getElementById("right"), right, p.blocks.map(function (b, k) { return [b[1], b[2], k]; }), "r", "l");
        document.title = left.name + " vs " + right.name;
        document.getElementById("overview").hidden = true;
        document.getElementById("comparison").hidden = false;
        window.scrollTo(0, 0);
    }

    function showOverview() {
        document.title = "copy-spotter results";
        document.getElementById("comparison").hidden = true;
        document.getElementById("overview").hidden = false;
    }

    // Pairs sorted by their highest shown score.
    const pairsHead = document.getElementById("pairs-head");
    if (ratioMode) {
        pairsHead.append(el("th", "Similarity"), el("th", "Document", "name"), el("th", "Document", "name"));
        document.getElementById("matrix-legend").textContent = "Symmetric similarity ratio (%) of each pair of documents.";
    } else {
        const aInB = el("th", "A in B");
        aInB.title = "% of A found in B";
        const bInA = el("th", "B in A");
        bInA.title = "% of B found in A";
        pairsHead.append(aInB, bInA, el("th", "Document A", "name"), el("th", "Document B", "name"));
        document.getElementById("matrix-legend").textContent = "Each cell is the % of the row document found in the column document.";
    }
    // Large runs: the table shows the first PAGE_SIZE matching pairs (more on demand) and the matrix is only drawn
    // up to MATRIX_MAX_DOCS documents, so the page stays responsive with hundreds of thousands of pairs.
    const PAGE_SIZE = 500;
    const MATRIX_MAX_DOCS = 150;

    // Pairs by "i,j" with i < j, for the matrix and the URL hash.
    const byPair = new Map();
    for (const p of pairs) byPair.set(p.i + "," + p.j, p);

    function pairRow(p) {
        const row = el("tr");
        const scores = ratioMode ? shown(p).slice(0, 1) : shown(p);
        for (const score of scores) {
            const cell = el("td");
            cell.appendChild(scoreLink(p, score));
            row.appendChild(cell);
        }
        row.append(nameCell("td", docs[p.i].name), nameCell("td", docs[p.j].name));
        return row;
    }

    // Pairs sorted by their highest shown score (ties keep the order of the data).
    const sortedPairs = pairs.slice().sort(function (x, y) { return best(y) - best(x); });
    const tbody = document.getElementById("pairs");
    const moreButton = document.getElementById("more-pairs");
    let matching = sortedPairs;
    let rendered = 0;

    function renderMorePairs() {
        const stop = Math.min(matching.length, rendered + PAGE_SIZE);
        const rows = document.createDocumentFragment();
        for (let k = rendered; k < stop; k += 1) rows.appendChild(pairRow(matching[k]));
        tbody.appendChild(rows);
        rendered = stop;
        const left = matching.length - rendered;
        moreButton.hidden = left === 0;
        moreButton.textContent = "Show " + Math.min(PAGE_SIZE, left) + " more pairs (" + left + " not shown)";
        let count = "Showing " + rendered + " of " + matching.length + " matching pairs";
        if (matching.length !== pairs.length) count += " (" + pairs.length + " pairs in total)";
        document.getElementById("pair-count").textContent = count;
        // Lets the optional add-on script (single_addon.html) decorate the rows that were just added.
        document.dispatchEvent(new Event("pairs-rendered"));
    }

    moreButton.addEventListener("click", renderMorePairs);

    // Matrix: the cell at row i, column j is the score of i found in j.
    const matrix = document.getElementById("matrix");
    const matrixRows = [];
    const matrixCells = [];
    if (docs.length > MATRIX_MAX_DOCS) {
        document.getElementById("matrix-wrap").hidden = true;
        document.getElementById("matrix-legend").textContent = "The matrix is drawn for up to " + MATRIX_MAX_DOCS +
            " documents; this run has " + docs.length + ". Use the pairs above and their filters.";
    } else {
        const head = el("tr");
        head.appendChild(el("th", "", "name"));
        docs.forEach(function (d) { head.appendChild(nameCell("th", d.name)); });
        matrix.appendChild(head);
        docs.forEach(function (d, i) {
            const row = el("tr");
            row.appendChild(nameCell("th", d.name));
            docs.forEach(function (_, j) {
                const p = i < j ? byPair.get(i + "," + j) : byPair.get(j + "," + i);
                if (i === j || !p) {
                    row.appendChild(el("td", "-", "self"));
                    return;
                }
                const score = shown(p)[i < j ? 0 : 1];
                const cell = el("td");
                cell.appendChild(scoreLink(p, score));
                row.appendChild(cell);
                matrixCells.push({cell: cell, score: score});
            });
            matrix.appendChild(row);
            matrixRows.push(row);
        });
    }

    // Filters.
    const minInput = document.getElementById("min-score");
    const nameInput = document.getElementById("name-filter");

    function applyFilters() {
        const min = parseFloat(minInput.value) || 0;
        const needle = nameInput.value.trim().toLowerCase();
        const matches = docs.map(function (d) { return !needle || d.name.toLowerCase().includes(needle); });
        matching = sortedPairs.filter(function (p) { return best(p) >= min && (matches[p.i] || matches[p.j]); });
        tbody.replaceChildren();
        rendered = 0;
        renderMorePairs();
        matrixRows.forEach(function (row, i) { row.hidden = !matches[i]; });
        for (const item of matrixCells) item.cell.classList.toggle("dim", item.score < min);
    }

    minInput.addEventListener("input", applyFilters);
    nameInput.addEventListener("input", applyFilters);

    // Navigation: the URL hash selects a pair, so links and the back button work.
    function route() {
        const m = /^#pair-(\d+)-(\d+)$/.exec(location.hash);
        const p = m && byPair.get(m[1] + "," + m[2]);
        if (p) showComparison(p); else showOverview();
    }

    document.getElementById("meta").textContent = data.meta;
    applyFilters();
    window.addEventListener("hashchange", route);
    route();
})();
</script>
</body>
</html>
