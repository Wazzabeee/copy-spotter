name: Web app

# Builds the browser app (web/) on every pull request and push to main, and deploys it to GitHub Pages from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke test the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs needs the tags to compute the version shown in the app
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: web/.cache
          key: web-downloads-${{ hashFiles('web/build.py') }}
      - run: uv sync --locked
      - name: Build the site
        run: uv run python web/build.py
      - name: Run the built site in Pyodide and compare with the CLI
        run: |
          node web/smoke.mjs web/_site data/pdf/plagiarism > "$RUNNER_TEMP/web.csv"
          uv run copy-spotter data/pdf/plagiarism --csv "$RUNNER_TEMP/cli.csv" -o "$RUNNER_TEMP/report" --no-open
          diff "$RUNNER_TEMP/cli.csv" "$RUNNER_TEMP/web.csv"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
