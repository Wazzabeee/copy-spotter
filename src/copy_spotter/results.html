<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>copy-spotter results</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #222;
            background: #fff;
        }

        main {
            padding: 20px;
        }

        .table-wrap {
            overflow-x: auto;
            margin-bottom: 32px;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background: #f5f5f5;
        }

        th.name, td.name {
            text-align: left;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td.self {
            color: #bbb;
            text-align: center;
        }

        a {
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .meta {
            color: #666;
        }
    </style>
</head>
<body>
<main>
    <h1>copy-spotter results</h1>
    <p class="meta">{{meta}}</p>

    <h2>Most similar pairs</h2>
    <div class="table-wrap">
        <table>
            <thead><tr>{{pairs_head}}</tr></thead>
            <tbody>
{{pairs}}
            </tbody>
        </table>
    </div>

    <h2>Similarity matrix</h2>
    <p class="meta">{{matrix_legend}}</p>
    <div class="table-wrap">
        <table>
{{matrix}}
        </table>
    </div>
</main>
</body>
</html>
