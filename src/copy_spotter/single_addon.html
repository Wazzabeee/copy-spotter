<style>
    .excluded {
        color: #8c8c8c;
    }

    .reference {
        font-size: 0.75em;
        font-weight: normal;
        color: #555;
        border: 1px solid #aaa;
        border-radius: 3px;
        padding: 0 3px;
        margin-left: 4px;
    }
</style>
<script>
(function () {
    "use strict";

    // Optional features of the single page, included only when the report uses them, so that reports without
    // them stay exactly as they were. Runs after the main script and adjusts what it rendered.
    const data = JSON.parse(document.getElementById("report-data").textContent);
    const docs = data.documents;
    const titles = {
        quote: "Quotation: left out of the matching",
        bibliography: "Bibliography: left out of the matching",
        template: "Found in a template: left out of the matching",
        common: "Found in many documents: left out of the matching",
    };

    // Grey the passages left out of the matching. The text container holds the document text in order, split
    // into text nodes and match spans; excluded words never match, so they are only found in plain text nodes.
    function greyExcluded(container, doc) {
        const ranges = (doc.excluded || []).map(function (run) {
            return [doc.spans[run[0]][0], doc.spans[run[0] + run[1] - 1][1], run[2]];
        });
        if (!container || !ranges.length) return;
        const nodes = [];
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) nodes.push(walker.currentNode);
        let offset = 0;
        for (const node of nodes) {
            const start = offset;
            const end = offset + node.data.length;
            offset = end;
            if (node.parentNode !== container) continue;
            const pieces = [];
            for (const [a, b, reason] of ranges) {
                const x = Math.max(a, start);
                const y = Math.min(b, end);
                if (x < y) pieces.push([x - start, y - start, reason]);
            }
            if (!pieces.length) continue;
            const fragment = document.createDocumentFragment();
            let pos = 0;
            for (const [x, y, reason] of pieces) {
                fragment.append(node.data.slice(pos, x));
                const span = document.createElement("span");
                span.className = "excluded";
                span.title = titles[reason] || "Left out of the matching";
                span.textContent = node.data.slice(x, y);
                fragment.append(span);
                pos = y;
            }
            fragment.append(node.data.slice(pos));
            node.replaceWith(fragment);
        }
    }

    // Add a "source" badge after the name of each reference source, wherever the page shows it.
    const referenceNames = new Set(docs.filter(function (d) { return d.reference; }).map(function (d) { return d.name; }));

    function badge() {
        const span = document.createElement("span");
        span.className = "reference";
        span.title = "Reference source";
        span.textContent = "source";
        return span;
    }

    function markReferences(nodes) {
        for (const node of nodes) {
            const name = node.title || node.textContent;
            if (referenceNames.has(name) && !node.querySelector(".reference")) node.appendChild(badge());
        }
    }

    function update() {
        markReferences(document.querySelectorAll("#overview .name"));
        const m = /^#pair-(\d+)-(\d+)$/.exec(location.hash);
        if (!m || document.getElementById("comparison").hidden) return;
        markReferences(document.querySelectorAll("#comparison h3"));
        greyExcluded(document.querySelector("#left .text"), docs[+m[1]]);
        greyExcluded(document.querySelector("#right .text"), docs[+m[2]]);
    }

    window.addEventListener("hashchange", update);
    // The main script renders the pairs list in pages (and again when the filters change): badge the new rows.
    document.addEventListener("pairs-rendered", function () { markReferences(document.querySelectorAll("#pairs .name")); });
    update();
})();
</script>
