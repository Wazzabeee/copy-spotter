<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #222;
            background: #fff;
        }

        header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 12px 20px 0;
        }

        header .score {
            font-weight: bold;
        }

        .container {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 20px 20px;
        }

        .content {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            padding: 10px;
            overflow: auto;
            height: 85vh;
            line-height: 1.5;
        }

        h3 {
            margin-top: 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .match {
            font-weight: bold;
        }

        a {
            color: #06c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }

            .content {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="_results.html">&larr; All results</a>
        <span class="score">{{score}}</span>
    </header>
    <div class="container">
        <div class="content" id="leftContent"><h3>{{left_name}}</h3>{{left}}</div>
        <div class="content" id="rightContent"><h3>{{right_name}}</h3>{{right}}</div>
    </div>
</body>
</html>
