[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "copy-spotter"
dynamic = ["version"]
description = "Find similar passages between documents (pdf, docx, odt, txt) and highlight them side by side."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clément Delteil" }]
requires-python = ">=3.10"
dependencies = [
    "odfpy>=1.4.1",
    "pdfminer.six>=20231228",
    "tqdm>=4.66.3",
]
keywords = ["plagiarism", "similarity", "text-comparison", "diff", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/Wazzabeee/copy-spotter"
Issues = "https://github.com/Wazzabeee/copy-spotter/issues"
Changelog = "https://github.com/Wazzabeee/copy-spotter/blob/main/CHANGELOG.md"

[project.scripts]
copy-spotter = "copy_spotter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-tqdm",
    "pre-commit>=3.7",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/copy_spotter"]

[tool.hatch.build.targets.sdist]
include = ["src/copy_spotter", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH"]
ignore = ["PLR0913", "PLR2004", "SIM905"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["odf.*", "pdfminer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["copy_spotter"]
